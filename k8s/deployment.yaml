# Applied by the platform into the repository's own namespace, e.g.
#   kubectl apply -n <repo-namespace> -f k8s/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-deploy-app
  labels:
    app: demo-deploy-app
spec:
  replicas: 1
  revisionHistoryLimit: 5   # keeps previous versions available for rollback
  selector:
    matchLabels:
      app: demo-deploy-app
  template:
    metadata:
      labels:
        app: demo-deploy-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: demo-deploy-app:latest   # replaced by the platform with the built image
          # The platform deploys the mutable :latest tag; always fetch it on pod start
          # so a restarted pod cannot keep using a cached image from an older build.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ENABLE_CHAOS
              value: "true"
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
